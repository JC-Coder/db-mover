<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#080504" />

    <!-- index.css pulls Inter and Outfit from Google Fonts; warming the connections cuts the render-blocking round trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Proves domain ownership for the Orynth product listing. -->
    <meta name="ory-verify" content="orynth-404548bdbe834cf196d5591507c65b17" />

    <!--
      Applies the stored theme before first paint. Pages are prerendered in the default dark theme,
      so without this a light-mode visitor would see a dark flash before React hydrates.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("db_mover_theme");
          document.documentElement.dataset.theme =
            stored === "light" ? "light" : "dark";
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
